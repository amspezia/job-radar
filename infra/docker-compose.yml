services:
  postgres:
    image: paradedb/paradedb:pg16
    command: postgres -c shared_preload_libraries='pg_search,pg_cron'
    environment:
      POSTGRES_USER: job_radar
      POSTGRES_PASSWORD: job_radar
      POSTGRES_DB: job_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_radar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
