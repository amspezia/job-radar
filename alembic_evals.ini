# Alembic environment for the EVALS database (`eval/`), separate from production's
# `alembic.ini` / `alembic/`: a different database, a different metadata, its own history.
# The URL is not configured here — `eval/evals_db/admin.py::migrate` sets it on the Config,
# and `alembic_evals/env.py` falls back to EVALS_DATABASE_URL.
# There is no logging section on purpose: `fileConfig()` would disable the host process's
# loggers (the migrations also run from inside pytest), and the CLI reports what it did.

[alembic]
script_location = %(here)s/alembic_evals
prepend_sys_path = %(here)s
path_separator = os
